name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: false
      - name: Test
        run: dotnet test CamOnKeyLight.Core.Tests/CamOnKeyLight.Core.Tests.csproj -c Release

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: false
      - name: Test and build
        run: dotnet test CamOnKeyLight.sln -c Release
      - name: Package
        shell: pwsh
        run: pwsh -NoProfile -File build/package.ps1 -Version 0.7.1 -InformationalVersion "0.7.1-ci.${{ github.run_number }}+${{ github.sha }}"
      - name: Install and uninstall the per-user setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $setup = Join-Path $dist "CamOnKeyLight-Setup.exe"
          $dest = Join-Path $env:LOCALAPPDATA "Programs\CamOnKeyLight"
          $uninstaller = Join-Path $dest "unins000.exe"
          if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/NORESTART" -Wait }
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (!(Test-Path (Join-Path $dest "CamOnKeyLight.exe"))) { throw "The installer did not place CamOnKeyLight.exe in LocalAppData." }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Cam On Key Light.lnk"
          if (!(Test-Path $shortcut)) {
            $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu"
            Write-Host "Start menu contents:"
            if (Test-Path $startMenu) { Get-ChildItem $startMenu -Recurse -Filter *.lnk | ForEach-Object { $_.FullName } }
            throw "The Start menu shortcut is missing."
          }
          $entry = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -eq "Cam On Key Light" }
          if (-not $entry) { throw "The per-user uninstall entry is missing." }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue
          if ($run -and $run.CamOnKeyLight) { throw "The installer turned on sign-in startup by itself." }
          $settingsDir = Join-Path $env:LOCALAPPDATA "CamOnKeyLight"
          New-Item -ItemType Directory -Force -Path $settingsDir | Out-Null
          $marker = Join-Path $settingsDir "user-settings.json"
          Set-Content -Path $marker -Value "{}" -Encoding ascii
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/NORESTART" -Wait
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path (Join-Path $dest "CamOnKeyLight.exe")) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dest "CamOnKeyLight.exe")) { throw "Uninstall left the program in place." }
          if (!(Test-Path $marker)) { throw "Uninstall removed user settings." }
          Get-Item $setup, (Join-Path $dist "CamOnKeyLight-win-x64.zip"), (Join-Path $dist "AutoKeyLight-win-x64.zip") | ForEach-Object { Write-Host ("{0} {1} bytes" -f $_.Name, $_.Length) }
      - name: Upload setup and portable zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CamOnKeyLight-windows
          path: |
            dist/CamOnKeyLight-Setup.exe
            dist/CamOnKeyLight-win-x64.zip
            dist/AutoKeyLight-win-x64.zip
          retention-days: 7
          if-no-files-found: error
