name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: false
      - name: Publish and attach the stable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Stable tags must look like v1.2.3. This workflow does not attach packages to other tags."
          }
          $version = $Matches[1]
          $out = Join-Path $env:RUNNER_TEMP "autokeylight-release"
          dotnet publish AutoKeyLight/AutoKeyLight.csproj -c Release -r win-x64 --self-contained true -p:Version=$version -p:DebugType=none -p:DebugSymbols=false -o $out
          Copy-Item LICENSE (Join-Path $out "LICENSE")
          Copy-Item README.md (Join-Path $out "README.md")
          $env:AUTOKEYLIGHT_PUBLISH_DIR = $out
          dotnet test AutoKeyLight.Core.Tests/AutoKeyLight.Core.Tests.csproj -c Release --filter PublishedOutputMatchesPackageRules
          $zip = Join-Path $env:RUNNER_TEMP "AutoKeyLight-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($out, $zip)
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $sum = Join-Path $env:RUNNER_TEMP "AutoKeyLight-win-x64.zip.sha256"
          [System.IO.File]::WriteAllText($sum, "$hash  AutoKeyLight-win-x64.zip`n")
          $innoSetup = Join-Path $env:RUNNER_TEMP "innosetup-6.4.3.exe"
          $innoDir = Join-Path $env:RUNNER_TEMP "innosetup"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe" -OutFile $innoSetup
          Start-Process -FilePath $innoSetup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$innoDir" -Wait
          & (Join-Path $innoDir "ISCC.exe") "/DMyAppVersion=$version" "/DPublishDir=$out" "installer\AutoKeyLight.iss"
          $setup = Join-Path (Resolve-Path "installer") "AutoKeyLight-Setup.exe"
          if (!(Test-Path $setup)) { throw "The per-user installer was not created." }
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $setupSum = Join-Path $env:RUNNER_TEMP "AutoKeyLight-Setup.exe.sha256"
          [System.IO.File]::WriteAllText($setupSum, "$setupHash  AutoKeyLight-Setup.exe`n")
          gh release upload $tag $zip $sum $setup $setupSum --repo $env:GITHUB_REPOSITORY --clobber
