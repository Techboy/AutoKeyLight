name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: false
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.event.release.tag_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Stable tags must look like v1.2.3. This workflow does not attach packages to other tags."
          }
          pwsh -NoProfile -File build/package.ps1 -Version $Matches[1]
          if ($LASTEXITCODE -ne 0) { throw "packaging failed with exit code $LASTEXITCODE." }
      - name: Attach the packages to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "${{ github.event.release.tag_name }}"
          gh release upload $tag `
            dist/CamOnKeyLight-win-x64.zip `
            dist/CamOnKeyLight-win-x64.zip.sha256 `
            dist/AutoKeyLight-win-x64.zip `
            dist/AutoKeyLight-win-x64.zip.sha256 `
            dist/CamOnKeyLight-Setup.exe `
            dist/CamOnKeyLight-Setup.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE." }
